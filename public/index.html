<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot Suite Console - Index</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 750px; background: #1e293b; border-radius: 12px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    h1 { margin-top: 0; color: #38bdf8; font-size: 24px; text-align: center; }
    .badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; background: #334155; color: #38bdf8; }
    .status-box { margin: 20px 0; padding: 15px; background: #0f172a; border-radius: 8px; border-left: 4px solid #38bdf8; display: flex; justify-content: space-between; align-items: center; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #94a3b8; }
    input[type="text"], input[type="email"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; }
    input:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .logs-title { margin-top: 30px; margin-bottom: 10px; font-size: 16px; color: #94a3b8; display: flex; justify-content: space-between; }
    .log-box { background: #090d16; border: 1px solid #334155; border-radius: 8px; padding: 15px; height: 260px; overflow-y: auto; font-family: monospace; font-size: 13px; color: #a7f3d0; }
    .log-entry { margin-bottom: 6px; border-bottom: 1px solid #1e293b; padding-bottom: 4px; }
    .flex-row { display: flex; gap: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Bot Suite Web Console</h1>
    
    <div class="status-box">
      <div>Status: <span class="badge" id="statusBadge">Idle</span></div>
      <span id="engineIndicator" style="color: #94a3b8; font-size: 12px;">○ Idle</span>
    </div>

    <!-- Start Task Form -->
    <div class="form-group">
      <label>Target Email Address:</label>
      <div class="flex-row">
        <input type="email" id="emailInput" placeholder="user@joblymail.in" required />
        <button type="button" id="startBtn" style="width: 150px;">Run bot.py</button>
      </div>
    </div>

    <!-- Submit OTP Form -->
    <div class="form-group">
      <label>Verification OTP Code:</label>
      <div class="flex-row">
        <input type="text" id="otpInput" placeholder="Enter 6-digit OTP code" required />
        <button type="button" id="otpBtn" style="width: 150px; background: #16a34a;">Send OTP</button>
      </div>
    </div>

    <div class="logs-title">
      <span>Live Output Stream (bot.py)</span>
      <span style="font-size: 12px; color: #64748b;">Auto-refreshing</span>
    </div>
    <div class="log-box" id="logContainer">
      <div class="log-entry">Connecting to server...</div>
    </div>
  </div>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        document.getElementById('statusBadge').innerText = data.status || 'Idle';
        
        const engine = document.getElementById('engineIndicator');
        if (data.active) {
          engine.innerText = '● Engine Active';
          engine.style.color = '#4ade80';
        } else {
          engine.innerText = '○ Idle';
          engine.style.color = '#94a3b8';
        }

        const logBox = document.getElementById('logContainer');
        if (data.logs && data.logs.length > 0) {
          logBox.innerHTML = data.logs.map(log => `<div class="log-entry">${escapeHtml(log)}</div>`).join('');
        }
      } catch (err) {
        console.error('Failed to update status:', err);
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('startBtn').addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value.trim();
      if (!email) return alert('Please enter an email address.');
      
      const res = await fetch('/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      fetchStatus();
    });

    document.getElementById('otpBtn').addEventListener('click', async () => {
      const otp = document.getElementById('otpInput').value.trim();
      if (!otp) return alert('Please enter the OTP code.');
      
      const res = await fetch('/api/submit-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ otp })
      });
      document.getElementById('otpInput').value = '';
      fetchStatus();
    });

    // Poll status every 2 seconds
    setInterval(fetchStatus, 2000);
    fetchStatus();
  </script>
</body>
</html>
